name: Refine venture studio footer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refine-venture-footer.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move venture navigation to footer bottom
        shell: python
        run: |
          from pathlib import Path
          import re
          skip={'.git','node_modules','.next','dist','build','coverage'}
          html_block='''<div class="jj-venture-nav" style="border-top:1px solid rgba(255,255,255,.10);padding:1rem 1.25rem 1.15rem;text-align:center;font-size:.78rem;letter-spacing:.045em"><a href="https://www.josephjilovec.com/ventures" style="color:#E7C45A;text-decoration:none;font-weight:700">A Joseph Jilovec Venture</a><span aria-hidden="true" style="color:#E7C45A;margin:0 .65rem;opacity:.7">•</span><a href="https://www.josephjilovec.com/ventures" style="color:#E7C45A;text-decoration:none;font-weight:800">Explore the Venture Studio →</a></div>'''
          jsx_block='''<div className="jj-venture-nav" style={{borderTop:'1px solid rgba(255,255,255,.10)',padding:'1rem 1.25rem 1.15rem',textAlign:'center',fontSize:'.78rem',letterSpacing:'.045em'}}><a href="https://www.josephjilovec.com/ventures" style={{color:'#E7C45A',textDecoration:'none',fontWeight:700}}>A Joseph Jilovec Venture</a><span aria-hidden="true" style={{color:'#E7C45A',margin:'0 .65rem',opacity:.7}}>•</span><a href="https://www.josephjilovec.com/ventures" style={{color:'#E7C45A',textDecoration:'none',fontWeight:800}}>Explore the Venture Studio →</a></div>'''
          for p in Path('.').rglob('*'):
            if not p.is_file() or p.suffix.lower() not in {'.html','.tsx','.jsx'} or any(x in skip for x in p.parts): continue
            s=p.read_text(encoding='utf-8',errors='ignore')
            if 'jj-venture-nav' not in s or '</footer>' not in s.lower(): continue
            old=s; s=re.sub(r'\s*<div\s+class(?:Name)?=["\']jj-venture-nav["\'][\s\S]*?</div>\s*','\n',s,count=1); s=re.sub(r'\s*[•·]\s*[A-Za-z0-9.-]+\.josephjilovec\.com','',s)
            block=html_block if p.suffix.lower()=='.html' else jsx_block; idx=s.lower().rfind('</footer>'); s=s[:idx]+block+'\n'+s[idx:]
            if s!=old: p.write_text(s,encoding='utf-8')
      - name: Commit refined footer and remove workflow
        run: |
          rm .github/workflows/refine-venture-footer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move venture studio navigation to footer bottom" || true
          git push